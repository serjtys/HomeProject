[tool.poetry]
name = "homeproject"
version = "0.1.0"
description = "\"README.md\""
authors = ["serj"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
python-dotenv = "^1.1.0"
pandas = "^2.2.3"
openpyxl = "^3.1.5"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
black = "^25.1.0"
isort = "^6.0.0"
mypy = "^1.15.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
hypothesis = "^6.131.17"
jaraco-path = "^3.7.2"
ini2toml = "^0.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119
multi_line_output = 1

[tool.coverage.report]
omit = ["*/site-packages/*", "*/tests/*"]

[tool.coverage.run]
branch = true
source = ["src"]